name: agentd CI

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths: ["agentd/**", ".github/workflows/agentd-ci.yml"]
  pull_request:
    paths: ["agentd/**", ".github/workflows/agentd-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e './agentd[dev]'
      - name: Lint
        run: cd agentd && ruff check src tests
      - name: Test (offline — scripted LLM, real git/subprocesses)
        run: cd agentd && python -m pytest tests -v
