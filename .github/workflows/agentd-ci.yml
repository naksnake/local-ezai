name: agentd CI

# Manual trigger only (2026-09-08, by request): the suite runs locally before
# every push (`make swe-test` + `make swe-lint`, or `cd agentd && python -m
# pytest tests`). Start a hosted run from the Actions tab when one is wanted.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e './agentd[dev,browser,control]'
      - name: Install Chromium for Browser QA tests
        run: python -m playwright install --with-deps chromium
      - name: Lint
        run: cd agentd && ruff check src tests
      - name: Test (offline — scripted LLM, real git/subprocesses/Chromium)
        run: cd agentd && python -m pytest tests -v
      - name: Chat-ops boundary drill (governance unreachable from chat, prompt injection, chat/RAG byte-identical)
        run: cd agentd && python -m pytest tests/security -v
      - name: First-run acceptance suite (F1–F11, offline)
        run: cd agentd && python -m pytest tests/acceptance -v
      - name: Release gate — parity harness (CLI-direct · CLI-connected · API over the CLI_AND_WEBUI §3 matrix)
        run: cd agentd && python -m pytest tests/parity -v
      - name: Release gate — agnosticism (third-runtime drill · H1 word audit · H2–H4 class fixtures)
        run: cd agentd && python -m pytest tests/gates -v
