model_list:

  # ── Main chat model (N97 / low-power CPU) ───────────────────────────────
  # Served by llama.cpp at http://vllm:8000 (service keeps the vllm name).
  # Both common sizes are routed; pick the one matching N97_MODEL_NAME in
  # your .env from OpenWebUI's model selector. llama.cpp serves whichever
  # single model it was started with, regardless of the requested name —
  # so the non-loaded entry also answers, just under the wrong label.
  - model_name: qwen2.5-3b
    litellm_params:
      model: openai/qwen2.5-3b
      api_base: http://vllm:8000/v1
      api_key: "not-needed-locally"

  - model_name: qwen2.5-1.5b
    litellm_params:
      model: openai/qwen2.5-1.5b
      api_base: http://vllm:8000/v1
      api_key: "not-needed-locally"

  # ── Embedding model ─────────────────────────────────────────────────────
  # Served by embed-server at http://embed-server:8001
  - model_name: nomic-embed
    litellm_params:
      model: openai/nomic-embed-text-v1.5
      api_base: http://embed-server:8001/v1
      api_key: "not-needed-locally"

# ── API Security ────────────────────────────────────────────────────────────
# OpenWebUI sends this key with every request
# Must match LITELLM_MASTER_KEY in your .env
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
