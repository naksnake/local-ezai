model_list:

  # ── Main chat model (vLLM on CPU) ───────────────────────────────────────
  # Served by vllm/vllm-openai-cpu at http://vllm:8000
  # The model_name here must match CPU_CHAT_MODEL_NAME in your .env
  - model_name: qwen2.5-1.5b
    litellm_params:
      model: openai/qwen2.5-1.5b
      api_base: http://vllm:8000/v1
      api_key: "not-needed-locally"

  # ── Role aliases (ADR-007 / ADR-026 R-1) ────────────────────────────────
  # The autonomous SWE agents bind to logical roles, never model names. On
  # this single-model profile every role is served by the chat model above;
  # the V1 renderer generates this section from the model registry.
  - model_name: role-orchestrator
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-planner
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-coder
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-debugger
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-reviewer
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-memory
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-chat
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-documentation
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-evolution
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}
  - model_name: role-sprint
    litellm_params: {model: openai/qwen2.5-1.5b, api_base: http://vllm:8000/v1, api_key: "not-needed-locally"}

  # ── Embedding model ─────────────────────────────────────────────────────
  # Served by embed-server at http://embed-server:8001
  - model_name: nomic-embed
    litellm_params:
      model: openai/nomic-embed-text-v1.5
      api_base: http://embed-server:8001/v1
      api_key: "not-needed-locally"

# ── API Security ────────────────────────────────────────────────────────────
# OpenWebUI sends this key with every request
# Must match LITELLM_MASTER_KEY in your .env
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# ── Auto-RAG hook ───────────────────────────────────────────────────────────
# Injects knowledge-base context into every chat and strips OpenWebUI's
# built-in knowledge tools. See config/litellm_custom_callbacks.py.
litellm_settings:
  callbacks: litellm_custom_callbacks.auto_rag_handler
