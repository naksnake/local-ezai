# Packaged model catalog seed (PR-4, ADR-026 R-5).
#
# DATA, not a blessed list: entries state declared capabilities and
# requirements — never hardware brands. Operators extend or override any id
# with config/catalog/*.yaml; a user-supplied hf:/gguf: reference needs no
# row here at all. Sizes are the artifact bytes reported by the hub
# (2026-09-08); install replaces them with measured bytes. Curated per-class
# content is a P5 deliverable — this seed covers the models the stack's
# profiles already default to plus the CLAUDE.md reference set.
version: 1
entries:
