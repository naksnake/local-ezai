[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentd"
version = "0.5.0"
description = "local-ezai — Local Autonomous Software Engineer: plan, code, validate, debug, and commit on your own hardware"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["autonomous", "software-engineering", "agents", "local-llm", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "langgraph>=0.2,<0.7",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/naksnake/local-ezai"
Documentation = "https://github.com/naksnake/local-ezai/blob/main/agentd/README.md"

[project.optional-dependencies]
browser = [
    "playwright>=1.40,<2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
local-ezai = "agentd.main_cli:main"
ezai = "agentd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
