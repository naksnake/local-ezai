[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentd"
version = "0.1.0"
description = "Local Autonomous Software Engineering runtime for local-ezai (Phase 1 MVP)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2,<0.7",
    "pydantic>=2.5,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ezai = "agentd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
